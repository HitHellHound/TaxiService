spring:
  config:
    import: file:config/secrets.yaml

  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: passengers
              uri: lb://passenger
              predicates:
                Path=/api/v1/passengers/**
            - id: drivers
              uri: lb://driver
              predicates:
                Path=/api/v1/drivers/**
            - id: rides
              uri: lb://ride
              predicates:
                Path=/api/v1/rides/**
            - id: ratings
              uri: lb://rating
              predicates:
                Path=/api/v1/ratings/**
          discovery:
            locator:
              enabled: true

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true