spring:
  config:
    import: file:config/secrets.properties

  application:
    name: ride

  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml

grpc:
  server:
    port: &grpc_port 9090

eureka:
  instance:
    metadata-map:
      grpc.port: *grpc_port
      grpc.enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        minimumNumberOfCalls: 5
        failureRateThreshold: 50

        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s

        slidingWindowSize: 10

        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

        ignoreExceptions:
          - com.efcon.ride.exception.EntityNotFoundException
          - com.efcon.ride.exception.ExternalBadRequestException