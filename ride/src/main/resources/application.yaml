spring:
  config:
    import: file:config/secrets.properties

  application:
    name: ride

  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml

  kafka:
    listener:
      ack-mode: manual_immediate
    consumer:
      group-id: ride-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.efcon.ride.external.event.*"
        spring.json.type.mapping: >-
          DriverCreatedEvent:com.efcon.ride.external.event.DriverCreatedEvent,
          DriverDeletedEvent:com.efcon.ride.external.event.DriverDeletedEvent,
          DriverChangedEvent:com.efcon.ride.external.event.DriverChangedEvent,
          DriverShiftEndedEvent:com.efcon.ride.external.event.DriverShiftEndedEvent,
          DriverShiftStartedEvent:com.efcon.ride.external.event.DriverShiftStartedEvent

outbound:
  events:
    kafka:
      topic:
        driver-events: driver-events

mq:
  ride-notifications:
    send:
      queue: ride-notifications.send.queue
      exchange: ride-notifications.send.exchange

grpc:
  server:
    port: &grpc_port 9090

eureka:
  instance:
    metadata-map:
      grpc.port: *grpc_port
      grpc.enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        minimumNumberOfCalls: 5
        failureRateThreshold: 50

        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s

        slidingWindowSize: 10

        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

        ignoreExceptions:
          - com.efcon.ride.exception.EntityNotFoundException
          - com.efcon.ride.exception.ExternalBadRequestException