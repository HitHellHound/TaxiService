spring:
  config:
    import: file:config/secrets.properties

  application:
    name: ride

  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml

grpc:
  server:
    port: &grpc_port 9090

eureka:
  instance:
    metadata-map:
      grpc.port: *grpc_port
      grpc.enabled: true