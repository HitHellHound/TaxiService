syntax = "proto3";

import "google/type/decimal.proto";
import "google/protobuf/timestamp.proto";

option java_package = "com.efcon.ride.grpc.stubs";
option java_multiple_files = true;

service RideGRPCService {
  rpc GetRideById (GetRideByIdRequest) returns (GetRideByIdResponse) {}
}

message GetRideByIdRequest {
  int64 id = 1;
}

message GetRideByIdResponse {
  Ride ride = 1;
}

message Ride {
  int64 id = 1;
  int64 driver_id = 2;
  int64 passenger_id = 3;
  string start_address = 4;
  string destination_address = 5;
  RideStatus status = 6;
  google.protobuf.Timestamp created_at = 7;
  google.type.Decimal price = 8;
}

enum RideStatus {
  CREATED = 0;
  ACCEPTED = 1;
  DRIVING_TO_PASSENGER = 2;
  DRIVING_TO_DESTINATION = 3;
  COMPLETED = 4;
  CANCELED = 5;
}